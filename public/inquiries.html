<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex"><title>Inquiries | Supreme Admin</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}
header{background:#14171f;color:#fff;padding:.8rem 1rem}
main{max-width:1000px;margin:1rem auto;padding:0 1rem}
.card{background:#fff;border-radius:10px;padding:1rem;margin-bottom:.8rem;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.meta{color:#666;font-size:.85rem;margin:.2rem 0 .6rem}
.msg{white-space:pre-wrap}
.row a{margin-right:.9rem}
</style></head><body>
<header><strong>Customer inquiries</strong></header>
<main id="list"><p>Loading…</p></main>
<script>
(async function () {
  var box = document.getElementById('list');
  function waNum(p) { var d = String(p).replace(/\D/g, ''); if (d.length === 10 && d[0] === '0') d = '254' + d.slice(1); return d; }
  try {
    var r = await fetch('/api/admin/inquiries', { credentials: 'same-origin' });
    if (r.status === 401) { box.textContent = 'Please log in to your admin panel first, then reload this page.'; return; }
    var rows = await r.json();
    if (!rows.length) { box.textContent = 'No inquiries yet.'; return; }
    box.textContent = '';
    rows.forEach(function (q) {
      var c = document.createElement('div'); c.className = 'card';
      var h = document.createElement('strong'); h.textContent = q.name + ' — ' + (q.subject || 'Inquiry');
      var m = document.createElement('div'); m.className = 'meta';
      m.textContent = new Date(q.created_at).toLocaleString() + ' · needs it: ' + (q.timeline || '-') + (q.email ? ' · ' + q.email : '');
      var t = document.createElement('div'); t.className = 'msg'; t.textContent = q.message;
      var a = document.createElement('div'); a.className = 'row'; a.style.marginTop = '.6rem';
      var tel = document.createElement('a'); tel.href = 'tel:' + String(q.phone).replace(/[^+\d]/g, ''); tel.textContent = 'Call ' + q.phone;
      var wa = document.createElement('a'); wa.href = 'https://wa.me/' + waNum(q.phone); wa.target = '_blank'; wa.rel = 'noopener'; wa.textContent = 'WhatsApp';
      a.append(tel, wa); c.append(h, m, t, a); box.append(c);
    });
  } catch (e) { box.textContent = 'Could not load inquiries.'; }
})();
</script></body></html>
