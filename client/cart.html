<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart | Supreme Auto Parts</title><link rel="stylesheet" href="/css/style.css?v=1791657314"></head>
<body>
<main class="container section">
  <h1>Your Cart</h1>
  <div id="cart-items"></div>
  <h3 style="margin-top:1rem">Total: <span id="cart-total">KSh 0</span></h3>
  <h2 style="margin-top:2rem">Checkout / Order Request</h2>
  <p style="margin-bottom:1rem">Fill in your delivery details. We deliver across East Africa within 72 hours.</p>
  <form id="checkout-form" class="checkout-form">
    <input type="text" name="customer_name" placeholder="Full Name" required>
    <input type="tel" name="phone" placeholder="Phone Number" required>
    <input type="email" name="email" placeholder="Email (optional)">
    <input type="text" name="location" placeholder="Delivery Location (East Africa)" required>
    <button class="btn" type="submit">Submit Order</button>
    <a class="btn green" href="https://wa.me/254759929222" target="_blank">Or Order via WhatsApp</a>
  </form>
</main>
<script src="/js/layout.js"></script>
<script src="/js/app.js"></script>
<script src="/js/site-info.js" defer></script>
<script src="/js/shop-enhance.js" defer></script>
<script src="/js/dedupe-header.js?v=1"></script>  <script src="/js/quick-actions.js" defer></script>
<script src="/js/inquiry.js" defer></script>
</body></html>
